name = "prabesh-portfolio"
main = "src/worker.mjs"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "portfolio"
# Paste the id of YOUR existing D1 database here (Cloudflare dashboard > D1).
database_id = "PASTE-YOUR-D1-DATABASE-ID"
